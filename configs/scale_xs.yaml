# =============================================================================
# scale_xs.yaml — scaling study point 1 of 5 (~4.9M params, 1.8M non-embed).
#
# Scaling study: width+depth grow together, everything else fixed. Fit final
# val_loss vs NON-EMBEDDING params (12 * layers * hidden^2). Fixed-token budget
# (40k steps) shared by all 5 points; seed 1337 -> identical init + data order.
# =============================================================================

run_name: scale_xs
wandb_group: scaling_study

# --- model (THE ONLY BLOCK THAT CHANGES ACROSS THE LADDER) ----------------
hidden_size: 192            # width
num_layers: 4               # depth
num_attention_heads: 3      # head_dim = 192 / 3 = 64
d_ff: 768                   # 4 * hidden_size
context_length: 256
seq_len: 256
vocab_size: 8000
dropout_rate: 0.1
activation_function: gelu
norm_type: layernorm

# --- optimization (held fixed across the ladder) -------------------------
optimizer: AdamW
learning_rate: 1.0e-3
weight_decay: 0.1
gradient_clip_norm: 1.0

# --- schedule (fixed-token budget: 40k steps = ~328M tokens) -------------
warmup_steps: 2000
max_steps: 40000
max_lr: 1.0e-3
min_lr: 3.0e-5

# --- logging / eval / checkpoint -----------------------------------------
log_interval: 10
eval_interval: 1000
eval_iters: 100
sample_interval: 2000
ckpt_interval: 5000

# --- data / runtime ------------------------------------------------------
batch_size: 32

# non-embed params = 12 * 4 * 192^2 = 1.77M ; total ~4.9M
