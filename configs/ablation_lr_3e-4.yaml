# =============================================================================
# ablation_lr_3e-4.yaml — LR sweep, 3e-4 arm (the baseline peak LR).
#
# Motivated by the warmup-stress ablation, where a 10x LR incidentally beat every
# baseline-LR arm. This sweep isolates peak LR as the variable: clipping is held
# ON at the default 1.0 (unlike the stress runs) so the ONLY thing that differs
# across the three arms is max_lr / min_lr / learning_rate. Same 22k budget.
#
# This arm reproduces the baseline peak LR and should land ~val_loss 1.60,
# matching the Ablation 1 LayerNorm / warmup_2000 arm (sanity anchor).
# =============================================================================

run_name: lr_3e-4
wandb_group: lr_sweep           # groups all three arms onto one W&B comparison
wandb_tags: [lr_sweep, lr3e-4]

# --- model ---------------------------------------------------------------
hidden_size: 512
num_layers: 8
num_attention_heads: 8
d_ff: 2048
context_length: 256
seq_len: 256
vocab_size: 8000
dropout_rate: 0.1
activation_function: gelu
norm_type: layernorm            # fixed at the Ablation 1 winner

# --- optimization --------------------------------------------------------
optimizer: AdamW
learning_rate: 3.0e-4
weight_decay: 0.1
gradient_clip_norm: 1.0         # clipping ON (default) — isolates LR from the stress runs

# --- schedule ------------------------------------------------------------
warmup_steps: 2000              # fixed (Ablation 2 showed warmup length is a no-op here)
max_steps: 22000                # ablation budget
max_lr: 3.0e-4                  # <-- the swept knob
min_lr: 3.0e-5                  # 10% of peak

# --- logging / eval / checkpoint ----------------------------------------
log_interval: 10
eval_interval: 1000
eval_iters: 100
sample_interval: 2000
ckpt_interval: 5000

# --- data / runtime ------------------------------------------------------
batch_size: 32
