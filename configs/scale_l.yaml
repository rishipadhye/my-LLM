# =============================================================================
# scale_l.yaml — scaling study point 5 of 5 (~69.2M params, 56.6M non-embed).
# See scale_xs.yaml for the study design; only the model block differs.
#
# LARGEST point: watch T4 memory. If it OOMs, halve batch_size to 16 and add
# grad accumulation x2 to keep effective tokens/step (and thus the token
# budget) identical to the rest of the ladder. Expect ~4h at 40k on T4.
# =============================================================================

run_name: scale_l
wandb_group: scaling_study

# --- model (THE ONLY BLOCK THAT CHANGES ACROSS THE LADDER) ----------------
hidden_size: 768            # width
num_layers: 8               # depth
num_attention_heads: 12     # head_dim = 768 / 12 = 64
d_ff: 3072                  # 4 * hidden_size
context_length: 256
seq_len: 256
vocab_size: 8000
dropout_rate: 0.1
activation_function: gelu
norm_type: layernorm

# --- optimization (held fixed across the ladder) -------------------------
optimizer: AdamW
learning_rate: 1.0e-3
weight_decay: 0.1
gradient_clip_norm: 1.0

# --- schedule (fixed-token budget: 40k steps = ~328M tokens) -------------
warmup_steps: 2000
max_steps: 40000
max_lr: 1.0e-3
min_lr: 3.0e-5

# --- logging / eval / checkpoint -----------------------------------------
log_interval: 10
eval_interval: 1000
eval_iters: 100
sample_interval: 2000
ckpt_interval: 5000

# --- data / runtime ------------------------------------------------------
batch_size: 32

# non-embed params = 12 * 8 * 768^2 = 56.62M ; total ~69.2M
