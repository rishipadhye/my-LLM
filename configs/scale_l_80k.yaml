# =============================================================================
# scale_l_80k.yaml — DIAGNOSTIC run, not a ladder point.
#
# Same model as scale_l (largest ladder point, 56.6M non-embed) but trained for
# DOUBLE the token budget (80k steps instead of 40k). Purpose: disambiguate the
# scaling fit's floor. The 40k ladder fit gives L = 1.16 + 0.78*N^-0.276, but
# that E=1.16 floor is BUDGET-conditioned. If scale_l at 80k drops well below
# the fully-trained 30M ref (val_loss 1.401) -> the ladder was compute-limited
# and scaling still has runway. If it stalls near ~1.40 -> that's the true
# TinyStories data ceiling, and the 40k floor was an artifact of the budget.
#
# Memory footprint is identical to scale_l (same width/depth/batch), which
# already fit on the T4 at 40k -> no OOM risk, no batch change needed. The only
# diffs from scale_l.yaml are run_name, max_steps, and this header. Cosine decay
# horizon auto-stretches to the new max_steps (same 1e-3 peak -> 3e-5 floor).
# Expect ~8h on T4 (2x the 40k run). Seed still 1337 -> same init + data order.
# =============================================================================

run_name: scale_l_80k
wandb_group: scaling_study

# --- model (identical to scale_l) ----------------------------------------
hidden_size: 768            # width
num_layers: 8               # depth
num_attention_heads: 12     # head_dim = 768 / 12 = 64
d_ff: 3072                  # 4 * hidden_size
context_length: 256
seq_len: 256
vocab_size: 8000
dropout_rate: 0.1
activation_function: gelu
norm_type: layernorm

# --- optimization (held fixed across the ladder) -------------------------
optimizer: AdamW
learning_rate: 1.0e-3
weight_decay: 0.1
gradient_clip_norm: 1.0

# --- schedule (DOUBLED budget: 80k steps = ~656M tokens) -----------------
warmup_steps: 2000
max_steps: 80000
max_lr: 1.0e-3
min_lr: 3.0e-5

# --- logging / eval / checkpoint -----------------------------------------
log_interval: 10
eval_interval: 1000
eval_iters: 100
sample_interval: 2000
ckpt_interval: 5000

# --- data / runtime ------------------------------------------------------
batch_size: 32

# non-embed params = 12 * 8 * 768^2 = 56.62M ; total ~69.2M (same as scale_l)
