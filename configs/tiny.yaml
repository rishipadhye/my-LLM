# =============================================================================
# tiny.yaml — flat hyperparameter config for the TinyStories LM.
#
# De-conflicted from the requested list. Where two values collided, one was
# chosen (see notes); soft suggestions are left as inline comments so you can
# decide. Loaded via src/config.py -> load_config("configs/tiny.yaml").
# =============================================================================

run_name: tiny

# --- model ---------------------------------------------------------------
hidden_size: 128            # (was given as both model_dim=128 and hidden_size=768;
                            #  kept the 128 "tiny" model — 768 is a separate ~120M model)
num_layers: 4
num_attention_heads: 4      # head_dim = 128/4 = 32
d_ff: 512                   # FFN intermediate width, 4 * hidden_size  (3072 belonged to the 768-dim model)
context_length: 2048        # SUGGEST: TinyStories are short; 256-512 is plenty and
                            #          you only ever train at seq_len below
seq_len: 128                # training window
vocab_size: 8000            # matches the trained tokenizer/tokenizer.json (8k BPE);
                            #          50k makes embeddings dominate a ~30M budget
dropout_rate: 0.1           # SUGGEST: 0.0 is common when data >> params
activation_function: gelu   # SUGGEST: gelu (standard for GPT-style decoders)
norm_type: "layernorm"

# --- optimization --------------------------------------------------------
optimizer: AdamW
learning_rate: 3.0e-4
weight_decay: 0.1          # NOTE: 0.1 is the more common transformer default
gradient_clip_norm: 1.0

# --- schedule ------------------------------------------------------------
warmup_steps: 100           # chosen over 1000 (1000/2000 = 50% warmup is too much)
max_steps: 2000             # total training steps (renamed from total_steps to match train.py)
max_lr: 3.0e-4              # peak LR for the cosine schedule (== learning_rate above)
min_lr: 3.0e-5              # floor LR at end of decay; 10% of max_lr is a common choice

# --- logging / eval / checkpoint ----------------------------------------
log_interval: 10            # log train loss / lr / grad_norm every N steps
eval_interval: 200          # run validation every N steps
eval_iters: 50              # how many val batches to average per eval
sample_interval: 500        # generate + log a text sample every N steps
ckpt_interval: 500          # save a checkpoint every N steps

# --- data / runtime ------------------------------------------------------
batch_size: 32              # chosen over 64
